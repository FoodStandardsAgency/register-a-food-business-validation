name: Publish to npm

# Runs on every push to master. If the version in package.json is not yet on npm, it runs the
# checks and publishes it. If that version is already published, it does nothing.
#
# To release: bump the version in package.json and update CHANGELOG.md in your pull request.
# The publish happens when the pull request is merged.
#
# Authentication is npm trusted publishing (OIDC): there is no npm token in this repository.
# The workflow filename is part of the trusted publisher setting on npmjs.com, so renaming
# this file breaks publishing until that setting is updated.

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check whether this version is already on npm
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          published=$(npm view "$name@$version" version 2>/dev/null || true)
          if [ "$published" = "$version" ]; then
            echo "$name@$version is already on npm. Nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is not on npm yet. Publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.publish == 'true'
        run: npm ci

      - if: steps.check.outputs.publish == 'true'
        run: npm run format:verify

      - if: steps.check.outputs.publish == 'true'
        run: npm test

      - if: steps.check.outputs.publish == 'true'
        run: npm publish
